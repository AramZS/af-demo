# Sveltia CMS configuration

# This is where we configure the CMS repo and its collections and fields
# Sveltia CMS generally follows the Decap CMS configuration spec
# Decap CMS docs: https://decapcms.org/docs/intro/
# Sveltia CMS docs: https://github.com/sveltia/sveltia-cms#features
# Sample: https://github.com/danurbanowicz/eleventy-sveltia-cms-starter/blob/master/admin/config.yml
# Sample: https://github.com/sveltia/sveltia-cms-demo

# Enter your GitHub repo path and branch (defaults to master)
backend:
  name: github
  repo: alfalfafilm/alfalfa-film-site
  branch: main

# The folder used to store uploaded images
media_folder: "src/assets/imgs"

# The CMS collections and their fields
collections:
  - name: sections
    label: Home Page Sections
    files:
      - name: cast
        label: Cast Section
        file: /src/cast.md
        fields:
          - { name: title, label: Title }
          - {name: "filename", label: "Filename", widget: "compute", value: "{{fields.path | plainify | slicer(1)}}"}
          - { label: "Permalink", name: "permalink", widget: "hidden" }
          - { label: "Path", name: "path", widget: "hidden" }
          - { label: "Page Types", name: "internalPageTypes", widget: "hidden"}
          - { label: "Layout", name: "layout", widget: "hidden"}          
          - { label: "Body", name: "body", widget: "markdown", hint: "Plain text, Markdown, and HTML formatting is supported. See the Markdown cheat sheet: https://github.com/adam-p/markdown-here/wiki/Markdown-Cheatsheet" }
      - name: funds
        label: Funding Section
        file: /src/funds.md
        fields:
          - { name: title, label: Title }
          - {name: "filename", label: "Filename", widget: "compute", value: "{{fields.path | plainify | slicer(1)}}"}
          - { label: "Permalink", name: "permalink", widget: "hidden" }
          - { label: "Path", name: "path", widget: "hidden" }
          - { label: "Page Types", name: "internalPageTypes", widget: "hidden"}
          - { label: "Layout", name: "layout", widget: "hidden"}          
          - { label: "Body", name: "body", widget: "richtext", hint: "Plain text, richtext, and HTML formatting is supported." }
      - name: impact
        label: Impact Section
        file: /src/impact.md
        fields:
          - { name: title, label: Title }
          - {name: "filename", label: "Filename", widget: "compute", value: "{{fields.path | plainify | slicer(1)}}"}
          - { label: "Permalink", name: "permalink", widget: "hidden" }
          - { label: "Path", name: "path", widget: "hidden" }
          - { label: "Page Types", name: "internalPageTypes", widget: "hidden"}
          - { label: "Layout", name: "layout", widget: "hidden"}          
          - { label: "Body", name: "body", widget: "markdown", hint: "Plain text, Markdown, and HTML formatting is supported. See the Markdown cheat sheet: https://github.com/adam-p/markdown-here/wiki/Markdown-Cheatsheet" }
      - name: index
        label: Top Section
        file: /src/index.md
        fields:
          - { name: title, label: Title }
          - { label: "Permalink", name: "permalink", widget: "hidden" }
          - { label: "Path", name: "path", widget: "hidden" }
          - { label: "Page Types", name: "internalPageTypes", widget: "hidden"}
          - { label: "Layout", name: "layout", widget: "hidden"}          
          - { label: "Body", name: "body", widget: "richtext", hint: "Plain text, richtext, and HTML formatting is supported." }
  - name: "blog"
    label: "Posts"
    label_singular: "Post"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      # - { label: "Author", name: "author", widget: "relation", collection: "authors", value_field: "name" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", default: ["post"], hint: "Enter tags separated by a comma" }
      - label: "Image"
        name: "image"
        widget: "image"
        hint: "Upload an image for this post. You can also use an image URL."
        # Uncomment the lines below if you want to set a max file upload size e.g. 2MB
        #media_library:
          #config:
            #max_file_size: 2048000 # maximum image file size in bytes
      - { label: "Image Alt Text", name: "imageAltText", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    folder: "pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Permalink", name: "permalink", widget: "hidden" }
      - label: "Navigation"
        name: "eleventyNavigation"
        widget: "object"
        fields:
          - { label: "Key", name: "key", widget: "string", hint: "A unique string for your navigation item, typically the page slug." }
          - { label: "Title", name: "title", widget: "string", hint: "The visible title of the navigation item." }
          - { label: "Order", name: "order", widget: "number", default: 999, hint: "Set a number between 0 and 999 to set the display order of your navigation item." }
      - { label: "Body", name: "body", widget: "markdown", hint: "Plain text, Markdown, and HTML formatting is supported. See the Markdown cheat sheet: https://github.com/adam-p/markdown-here/wiki/Markdown-Cheatsheet" }
  - name: "siteconfig"
    label: "Site Configuration"
    icon: "settings"
    extension: "json"
    format: "json"
    files:
      - file: "src/_data/metadata.json"
        label: "Site Information"
        name: "metadata"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string", hint: "Your site's title, used for branding and SEO." }
          - { label: "Site Description", name: "description", widget: "text", hint: "Your site's description, used for SEO." }
          - { label: "Site URL", name: "url", widget: "string", hint: "Your live site's full URL." }
      - file: "src/_data/navList.json"
        label: "Navigation links"
        name: "navList"
        summary: "Navigation Items"
        fields:
          - label: Navigation List
            name: nav
            widget: list        
            min: 1
            max: 6
            fields:
              - { label: "Navigation Item", name: "name", field: { widget: "string", hint: "The item appearing in navigation" }  }
              - { label: "Linked Page", name: "pageFilename", field: { widget: "string", hint: "The filename given in the section edit area" } }          
      - file: "src/_data/homepage.json"
        label: "Top-of-homepage Text"
        name: "homepage"
        summary: "Text from the top of the site"
        fields:
          - { label: "Title", name: "title", widget: "string", hint: "Displayed title" }
          - { label: "Subtitle", name: "subtitle", widget: "string", hint: "Displayed subtitle" }
          - { label: "Left Top Text", name: "homepageLeft", widget: "string", hint: "Left text" }
          - { label: "Right Top Text", name: "homepageRight", widget: "string", hint: "Right text" }
          - { label: "Scroll Down Prompt", name: "scrollDownPrompt", widget: "string", hint: "Scroll Down floating prompt text" }          

