<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS</title>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Sveltia CMS -->
    <script src="sveltia-local.js"></script>
	<script>
		const transform = (value, { args, locale }) => {
			// Return the transformed value
			return value.slice(args[0]);
		};
		CMS.registerStringTransformation("slicer", transform);
	</script>
  </body>
</html>
